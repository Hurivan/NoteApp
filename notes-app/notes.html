<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notecards - ProjectX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="brand-logo">ProjectX</div>
            <nav class="header-nav">
                <a href="index.html" class="nav-item">To-Do</a>
                <a href="notes.html" class="nav-item active">Notes</a>
            </nav>
            <div class="tools-menu">
                <button class="tools-btn" id="exportBtn">Export</button>
                <button class="tools-btn" id="importBtn">Import</button>
                <input type="file" id="importFile" class="hidden-file-input" accept=".json">
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>notecards</h1>
            <nav class="tabs">
                <button class="tab-btn active" data-sort="date">Sort by Date</button>
                <button class="tab-btn" data-sort="title">Sort by Title</button>
            </nav>
        </div>

        <div class="add-section">
            <button class="add-btn" id="addNoteBtn">
                <span class="plus-icon">+</span>
            </button>
        </div>

        <div class="list-container" id="noteList">
            <!-- Note items will be dynamically inserted here -->
        </div>
    </div>

    <!-- Modal for editing/creating notes -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Notecard</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <form id="noteForm">
                <input type="hidden" id="noteId">
                
                <div class="form-group">
                    <label for="noteTitle">Title</label>
                    <input type="text" id="noteTitle" required>
                </div>

                <div class="form-group">
                    <label for="noteCategory">Category</label>
                    <input type="text" id="noteCategory" placeholder="e.g., Meeting, Idea, Research">
                </div>

                <div class="form-group">
                    <label for="noteDate">Date</label>
                    <input type="date" id="noteDate" required>
                </div>

                <div class="form-group">
                    <label for="noteDescription">Description</label>
                    <textarea id="noteDescription" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label for="noteContent">Content</label>
                    <div id="noteContent" class="scrapbook-editor"></div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                    <button type="button" class="btn-danger" id="deleteBtn" style="display: none;">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <script src="scrapbook-editor.js"></script>
    <script src="notes.js"></script>
</body>
</html>
